name: Run revision wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-revision-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/wire_revision_editor.py
      - run: node --check revision-editor.js && node --check service-worker.js
      - run: grep -q 'revision-editor.js' index.html && grep -q 'life-archive-pwa-v23' service-worker.js
      - run: rm -f .github/workflows/run-revision-wiring.yml tools/wire_revision_editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire guided revision workspace into app"
          git push
