name: Fix Timeline sidebar load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-timeline-sidebar-load.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make app loading deterministic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # 1) Load the real app modules directly from index.html.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts='''\n<script src="./memories.js"></script>\n<script type="module" src="./book-positioning.js"></script>\n<script type="module" src="./book-positioning-ui.js"></script>\n<script type="module" src="./firebase-cloud-sync.js"></script>\n<script type="module" src="./mobile-auth.js"></script>\n'''
          if 'src="./firebase-cloud-sync.js"' not in s:
              s=s.replace('</body>',scripts+'</body>')
          p.write_text(s,encoding='utf-8')

          # 2) Firebase Hosting should serve index.html normally instead of the old
          # hosting-home.html document.write/blob-module wrapper.
          p=Path('firebase.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg.setdefault('hosting',{}).pop('rewrites',None)
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 3) Keep hosting-home.html as a harmless backward-compatible redirect.
          Path('hosting-home.html').write_text('''<!doctype html>\n<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta http-equiv="refresh" content="0;url=./index.html">\n<title>Life Archive</title>\n</head>\n<body>\n<script>location.replace('./index.html');</script>\n<a href="./index.html">開啟 Life Archive</a>\n</body>\n</html>\n''',encoding='utf-8')

          # 4) Force PWA clients to discard the old app-shell cache.
          p=Path('service-worker.js')
          sw=p.read_text(encoding='utf-8')
          sw=sw.replace("const CACHE_NAME='life-archive-pwa-v19';","const CACHE_NAME='life-archive-pwa-v20';")
          p.write_text(sw,encoding='utf-8')

          # 5) Sidebar is defensive: if a stale/custom index lacks Timeline,
          # recreate the button rather than waiting forever for another module.
          p=Path('workflow-sidebar.js')
          ws=p.read_text(encoding='utf-8')
          marker="function arrange(){\n  const nav=document.getElementById('nav');if(!nav)return false;"
          replacement="function arrange(){\n  const nav=document.getElementById('nav');if(!nav)return false;\n  if(!nav.querySelector('[data-v=\"timeline\"]')){\n    const btn=document.createElement('button');\n    btn.dataset.v='timeline';\n    btn.textContent=LABELS.timeline;\n    const source=nav.querySelector('[data-v=\"source\"]');\n    nav.insertBefore(btn,source||null);\n  }"
          if marker in ws:
              ws=ws.replace(marker,replacement)
          p.write_text(ws,encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-timeline-sidebar-load.yml

      - name: Validate patched files
        run: |
          python -m json.tool firebase.json >/dev/null
          node --check workflow-sidebar.js
          node --check service-worker.js
          grep -q 'src="./firebase-cloud-sync.js"' index.html
          grep -q 'src="./book-positioning-ui.js"' index.html
          grep -q "life-archive-pwa-v20" service-worker.js
          if grep -q '"rewrites"' firebase.json; then
            echo 'Firebase rewrite still present' >&2
            exit 1
          fi

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase.json hosting-home.html service-worker.js workflow-sidebar.js .github/workflows/fix-timeline-sidebar-load.yml
          git commit -m "fix: keep Timeline visible after app load"
          git push
