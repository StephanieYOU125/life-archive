name: Wire chapter editor plus
on:
  push:
    paths:
      - '.github/workflows/wire-chapter-editor-plus.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire chapter editor script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if './chapter-editor-plus.js' not in s:
              s=s.replace('</body>','<script src="./chapter-editor-plus.js"></script>\n</body>')
          p.write_text(s)

          p=Path('service-worker.js')
          s=p.read_text()
          s=s.replace("const CACHE_NAME='life-archive-pwa-v27'","const CACHE_NAME='life-archive-pwa-v28'")
          if "'./chapter-editor-plus.js'" not in s:
              s=s.replace("'./dashboard-workspace.js'","'./dashboard-workspace.js','./chapter-editor-plus.js'")
          if "if(!body.includes('chapter-editor-plus.js'))" not in s:
              s=s.replace("if(!body.includes('dashboard-workspace.js')) body=body.replace('</body>','<script src=\"./dashboard-workspace.js\"></script></body>');", "if(!body.includes('dashboard-workspace.js')) body=body.replace('</body>','<script src=\"./dashboard-workspace.js\"></script></body>');\n    if(!body.includes('chapter-editor-plus.js')) body=body.replace('</body>','<script src=\"./chapter-editor-plus.js\"></script></body>');")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check chapter-editor-plus.js
          node --check service-worker.js
          grep -q 'chapter-editor-plus.js' index.html
          grep -q 'life-archive-pwa-v28' service-worker.js
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/wire-chapter-editor-plus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/wire-chapter-editor-plus.yml
          git commit -m "feat: wire chapter title lab into editor"
          git push
