name: Run references wiring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-references-wiring.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/wire_references_editor.py
      - run: node --check references-editor.js && node --check service-worker.js
      - run: grep -q 'LifeArchiveStateBridge' index.html && grep -q 'references-editor.js' index.html && grep -q 'life-archive-pwa-v22' service-worker.js
      - run: rm -f .github/workflows/run-references-wiring.yml tools/wire_references_editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire guided references editor into app"
          git push
