name: Run sidebar consolidation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate_sidebar.py'
      - '.github/workflows/run-sidebar-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate sidebar
        run: python scripts/consolidate_sidebar.py
      - name: Validate JavaScript
        run: |
          node --check workflow-sidebar.js
          node --check timeline.js
          node --check service-worker.js
      - name: Remove one-time files
        run: |
          rm -f scripts/consolidate_sidebar.py
          rm -f .github/workflows/run-sidebar-consolidation.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make sidebar a single source of truth"
          git push
