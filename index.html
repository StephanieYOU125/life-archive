<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Life Archive｜照片回憶寫作</title>
<style>
:root{--ink:#27231f;--muted:#817970;--paper:#f3eee7;--card:#fffdfa;--line:#ded5c9;--accent:#7b3945;--soft:#f2e3e6;--side:#211f1d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--side);color:#fff;padding:28px 20px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800}.brand small{display:block;color:#bdb5ad;font-size:12px;margin-top:5px}.nav{margin-top:32px;display:grid;gap:8px}.nav button{border:0;background:transparent;color:#d8d0c8;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#35312d;color:#fff}.privacy{position:absolute;bottom:25px;left:20px;right:20px;font-size:12px;color:#aaa19a;line-height:1.6}.main{padding:38px;max-width:1200px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}.hero h1{font-family:"Noto Serif TC",serif;font-size:38px;margin:8px 0}.hero p{color:#655e57;line-height:1.8;max-width:680px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:10px 15px;border-radius:12px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.drop{background:var(--card);border:2px dashed #cdbfb2;border-radius:22px;padding:30px;text-align:center;margin-bottom:20px;transition:.2s}.drop.drag{border-color:var(--accent);background:var(--soft)}.drop strong{display:block;font-size:20px}.drop span{display:block;color:var(--muted);margin:8px 0 16px}.toolbar{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin:20px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 12px;color:var(--ink)}.count{font-size:13px;color:var(--muted);margin-bottom:12px}.grid{display:grid;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(250px,38%) 1fr;box-shadow:0 10px 30px rgba(50,40,30,.05)}.photo{background:#e7dfd6;min-height:320px;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;max-height:520px;object-fit:contain}.body{padding:22px}.titleRow{display:flex;gap:10px}.titleRow input{font-size:20px;font-weight:750;flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;outline:none}.delete{border:0;background:transparent;color:#a34b45;cursor:pointer}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field.full{grid-column:1/-1}.field textarea{min-height:150px;resize:vertical;line-height:1.75}.prompt span{font-size:15px;color:var(--accent)}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.saved{font-size:12px;color:var(--muted)}.empty{padding:60px 20px;text-align:center;background:rgba(255,255,255,.5);border-radius:20px;color:var(--muted)}.status{position:fixed;right:22px;bottom:22px;background:#28231f;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.status.show{opacity:1;transform:none}.hidden{display:none!important}@media(max-width:800px){.app{display:block}.side{height:auto;position:relative;padding:18px}.nav{margin-top:15px;display:flex;overflow:auto}.privacy{display:none}.main{padding:22px 15px}.hero{display:block}.hero h1{font-size:30px}.actions{margin-top:18px}.toolbar{grid-template-columns:1fr}.card{grid-template-columns:1fr}.photo{min-height:230px}.meta{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">Life Archive<small>私人生命故事資料庫</small></div><div class="nav"><button class="active">▧ 照片回憶</button></div><div class="privacy">照片與文字預設只存在目前瀏覽器。<br>請定期下載 JSON 備份。</div></aside>
<main class="main"><div class="hero"><div><span class="eyebrow">PHOTO → MEMORY → STORY</span><h1>從一張照片，找回一段故事。</h1><p>不用一開始就寫成文章。先上傳以前的照片，在下面記下「那時候，我在做什麼？」。時間久了，這裡會成為你的生命素材庫。</p></div><div class="actions"><button class="btn" id="exportBtn">匯出 JSON</button><label class="btn">匯入 JSON<input class="hidden" id="importInput" type="file" accept="application/json"></label></div></div>
<div class="drop" id="drop"><strong>把以前的照片放進來</strong><span>可一次選多張 JPG、PNG、WebP。照片會縮小後存在本機瀏覽器。</span><label class="btn primary">＋ 選擇照片<input class="hidden" id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div>
<div class="toolbar"><input id="search" placeholder="搜尋回憶、地點、故事…"><select id="stage"><option value="all">全部人生階段</option><option>童年</option><option>國中</option><option>高中</option><option>警大</option><option>警察工作</option><option>研究所</option><option>旅行</option><option>海外生活</option><option>運動／挑戰</option><option>其他</option></select><select id="sort"><option value="new">最新加入</option><option value="old">最早加入</option><option value="title">標題排序</option></select></div>
<div class="count" id="count"></div><div class="grid" id="grid"></div></main></div><div class="status" id="status"></div>
<script>
(()=>{'use strict';const DB='life-archive-v1',STORE='memories';let db,items=[];const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);function toast(t){const e=$('#status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function all(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function del(id){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function clear(){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}function dataURL(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const scale=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.86))};im.onerror=()=>{URL.revokeObjectURL(u);rej(Error('無法讀取 '+file.name))};im.src=u})}async function addFiles(fs){const files=[...fs].filter(f=>f.type.startsWith('image/'));if(!files.length)return;toast('正在整理照片…');for(const f of files){try{const x={id:uid(),image:await dataURL(f),name:f.name,title:'',when:'',stage:'其他',place:'',story:'',created:new Date().toISOString(),updated:new Date().toISOString()};await put(x);items.unshift(x)}catch(e){alert(e.message)}}render();toast('照片已加入，只存在目前瀏覽器')}function stages(v){return ['童年','國中','高中','警大','警察工作','研究所','旅行','海外生活','運動／挑戰','其他'].map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}function card(x){return `<article class="card" data-id="${x.id}"><div class="photo"><img src="${x.image}" alt="${esc(x.title||x.name)}"></div><div class="body"><div class="titleRow"><input data-f="title" value="${esc(x.title)}" placeholder="替這段回憶取一個名字（選填）"><button class="delete" data-act="delete">刪除</button></div><div class="meta"><label class="field"><span>時間</span><input data-f="when" value="${esc(x.when)}" placeholder="例如：2015 夏天／警大二年級"></label><label class="field"><span>人生階段</span><select data-f="stage">${stages(x.stage)}</select></label><label class="field full"><span>地點</span><input data-f="place" value="${esc(x.place)}" placeholder="例如：臺北、東京、宿舍、操場"></label><label class="field full prompt"><span>那時候，我在做什麼？</span><textarea data-f="story" placeholder="先記下事實：我在哪裡、和誰、正在做什麼、為什麼拍下這張照片……">${esc(x.story)}</textarea></label></div><div class="bottom"><span class="saved">自動儲存</span><button class="btn" data-act="copy">複製成寫作素材</button></div></div></article>`}function filtered(){const q=$('#search').value.trim().toLowerCase(),s=$('#stage').value,sort=$('#sort').value;let a=items.filter(x=>(s==='all'||x.stage===s)&&(!q||[x.title,x.when,x.stage,x.place,x.story,x.name].join(' ').toLowerCase().includes(q)));a.sort((a,b)=>sort==='old'?a.created.localeCompare(b.created):sort==='title'?(a.title||'').localeCompare(b.title||'','zh-Hant'):b.created.localeCompare(a.created));return a}function render(){const a=filtered();$('#count').textContent=`${a.length} / ${items.length} 張回憶`;$('#grid').innerHTML=a.length?a.map(card).join(''):`<div class="empty">${items.length?'沒有符合條件的回憶。':'先放進第一張舊照片。看到照片，比從空白頁開始更容易想起故事。'}</div>`}let timers={};$('#grid').addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const c=e.target.closest('.card'),x=items.find(i=>i.id===c.dataset.id);x[f]=e.target.value;x.updated=new Date().toISOString();clearTimeout(timers[x.id]);timers[x.id]=setTimeout(()=>put(x),400)});$('#grid').addEventListener('change',e=>{if(e.target.dataset.f)e.target.dispatchEvent(new Event('input',{bubbles:true}))});$('#grid').addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const c=b.closest('.card'),x=items.find(i=>i.id===c.dataset.id);if(b.dataset.act==='delete'){if(confirm('刪除這張照片回憶？')){await del(x.id);items=items.filter(i=>i.id!==x.id);render()}}else{const t=[x.title&&`【${x.title}】`,x.when&&`時間：${x.when}`,x.stage&&`人生階段：${x.stage}`,x.place&&`地點：${x.place}`,'',`當時我在做什麼：\n${x.story||'（尚未填寫）'}`].filter(v=>v!==false&&v!=null).join('\n');await navigator.clipboard.writeText(t);toast('已複製成寫作素材')}});['search','stage','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#photoInput').addEventListener('change',e=>addFiles(e.target.files));const d=$('#drop');['dragenter','dragover'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>addFiles(e.dataTransfer.files));$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'life-archive',version:1,exported:new Date().toISOString(),memories:items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-archive-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importInput').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.memories))throw Error();if(!confirm(`匯入 ${j.memories.length} 張回憶並取代目前資料？`))return;await clear();for(const x of j.memories)await put(x);items=j.memories;render();toast('備份已匯入')}catch{alert('不是有效的 Life Archive 備份')}};(async()=>{try{await openDB();items=await all();render()}catch(e){console.error(e);$('#grid').innerHTML='<div class="empty">無法開啟本機資料庫。請不要使用無痕模式。</div>'}})()})();
</script>
</body></html>
