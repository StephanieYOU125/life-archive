name: Add Timeline Category and Number
on:
  push:
    paths:
      - '.github/workflows/add-timeline-category-number.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timeline columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('timeline.js')
          s=p.read_text()

          s=s.replace("const TIMELINE_STATUSES=['已確認','部分確認','待確認','有矛盾'];", "const TIMELINE_STATUSES=['已確認','部分確認','待確認','有矛盾'];\nconst TIMELINE_CATEGORIES=['國小','國中','高中','大學','研究所','工作','旅行','交換','運動','娛樂','挑戰','其他'];")

          s=s.replace("function statusClass(s){return s==='已確認'?'ok':s==='部分確認'?'partial':s==='有矛盾'?'conflict':'pending';}", "function statusClass(s){return s==='已確認'?'ok':s==='部分確認'?'partial':s==='有矛盾'?'conflict':'pending';}\nfunction categoryOptions(value){const options=[...TIMELINE_CATEGORIES];if(value&&!options.includes(value))options.push(value);return options.map(x=>`<option${x===value?' selected':''}>${x}</option>`).join('');}")

          old_header='<div class="timeline-table-wrap"><table class="timeline-table"><thead><tr><th style="width:12%">時間</th><th style="width:16%">身分／經歷</th><th style="width:27%">履歷／面試可以怎麼用</th><th style="width:24%">成果／能力</th><th style="width:17%">確認狀態</th><th style="width:4%"></th></tr></thead><tbody id="tlBody"></tbody></table></div>`;'
          new_header='<div class="timeline-table-wrap"><table class="timeline-table"><thead><tr><th style="width:4%">序號</th><th style="width:10%">經歷分類</th><th style="width:11%">時間</th><th style="width:14%">身分／經歷</th><th style="width:24%">履歷／面試可以怎麼用</th><th style="width:21%">成果／能力</th><th style="width:12%">確認狀態</th><th style="width:4%"></th></tr></thead><tbody id="tlBody"></tbody></table></div>`;'
          if old_header not in s: raise SystemExit('timeline table header target not found')
          s=s.replace(old_header,new_header)

          s=s.replace("[x.time,x.identity,x.resume,x.result,x.status,x.note]", "[x.category,x.time,x.identity,x.resume,x.result,x.status,x.note]")

          old_render="body.innerHTML=rows.length?rows.map(x=>`<tr data-id=\"${x.id}\">\n    <td data-label=\"時間\"><textarea data-f=\"time\" placeholder=\"例如：2019-10\">${esc(x.time)}</textarea></td>"
          new_render="body.innerHTML=rows.length?rows.map((x,index)=>`<tr data-id=\"${x.id}\">\n    <td data-label=\"序號\" class=\"timeline-seq\">${index+1}</td>\n    <td data-label=\"經歷分類\"><select data-f=\"category\">${categoryOptions(x.category||'其他')}</select></td>\n    <td data-label=\"時間\"><textarea data-f=\"time\" placeholder=\"例如：2019-10\">${esc(x.time)}</textarea></td>"
          if old_render not in s: raise SystemExit('timeline render target not found')
          s=s.replace(old_render,new_render)

          s=s.replace("colspan=\"6\"", "colspan=\"8\"")
          s=s.replace("timeline.unshift({id:uid(),time:'',identity:'',resume:'',result:'',status:'待確認',note:''})", "timeline.unshift({id:uid(),category:'其他',time:'',identity:'',resume:'',result:'',status:'待確認',note:''})")

          css_anchor=".timeline-table td{vertical-align:top;padding:9px;border-bottom:1px solid #eee7df}.timeline-table tr:last-child td{border-bottom:0}"
          css_new=css_anchor+"\n  .timeline-seq{text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:17px!important}"
          if css_anchor not in s: raise SystemExit('timeline css anchor not found')
          s=s.replace(css_anchor,css_new)

          p.write_text(s)

          sw=Path('service-worker.js')
          if sw.exists():
              import re
              t=sw.read_text()
              t=re.sub(r"life-archive-pwa-v\d+","life-archive-pwa-v38",t,count=1)
              sw.write_text(t)
          PY
      - name: Validate
        run: |
          node --check timeline.js
          grep -q "TIMELINE_CATEGORIES" timeline.js
          grep -q "經歷分類" timeline.js
          grep -q "timeline-seq" timeline.js
          grep -q "life-archive-pwa-v38" service-worker.js
      - name: Commit and self-delete
        run: |
          rm .github/workflows/add-timeline-category-number.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js service-worker.js .github/workflows/add-timeline-category-number.yml
          git commit -m "feat: add sequence and category to life timeline"
          git push
