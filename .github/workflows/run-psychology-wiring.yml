name: Run psychology wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-psychology-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/wire_psychology_lenses.py
      - run: node --check psychology-lenses.js && node --check service-worker.js
      - run: grep -q 'psychology-lenses.js' index.html && grep -q 'life-archive-pwa-v24' service-worker.js
      - run: rm -f .github/workflows/run-psychology-wiring.yml tools/wire_psychology_lenses.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire psychology lens library into app"
          git push
