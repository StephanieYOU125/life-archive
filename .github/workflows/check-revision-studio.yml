name: Check revision studio
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node --check revision-editor.js
      - run: node --check service-worker.js
      - run: grep -q "life-archive-pwa-v27" service-worker.js
      - run: grep -q "畫面細節" revision-editor.js
      - run: grep -q "SEE → FEEL → UNDERSTAND" revision-editor.js
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/check-revision-studio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove one-time revision check workflow"
          git push
