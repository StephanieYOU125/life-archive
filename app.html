<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211f1d">
<link rel="manifest" href="manifest.webmanifest">
<title>Life Archive｜照片回憶</title>
<style>
body{margin:0;background:#f3eee7;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}*{box-sizing:border-box}.wrap{max-width:980px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end}.top h1{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;margin:7px 0}.muted{color:#817970;line-height:1.7}.btn{display:inline-block;border:1px solid #ded5c9;background:#fffdf9;padding:10px 14px;border-radius:11px;text-decoration:none;color:inherit;cursor:pointer}.primary{background:#7b3945;color:#fff;border-color:#7b3945}.drop{margin:22px 0;background:#fffdf9;border:2px dashed #cbbdaf;border-radius:18px;padding:24px;text-align:center}.hidden{display:none}.add-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.grid{display:grid;gap:18px}.card{background:#fffdf9;border:1px solid #ded5c9;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,36%) 1fr}.photo{background:#e7dfd6;min-height:260px;display:grid;place-items:center}.photo img{width:100%;height:100%;max-height:440px;object-fit:contain}.photo-empty{padding:35px;text-align:center;color:#817970}.photo-empty strong{display:block;font-size:28px;margin-bottom:8px}.body{padding:18px}.body input,.body textarea,.body select{width:100%;border:1px solid #ded5c9;background:white;border-radius:9px;padding:10px;margin:5px 0 11px}.body textarea{min-height:130px;resize:vertical}.body label{font-size:11px;color:#817970;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.title{font-size:19px;font-weight:750}.empty{text-align:center;color:#817970;padding:45px;background:#fffdf9;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#a34b45}.eyebrow{font-size:11px;color:#7b3945;font-weight:800;letter-spacing:.12em}.cloud{margin:18px 0;background:#fffdf9;border:1px solid #ded5c9;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.cloud strong{display:block}.cloud small{color:#817970;line-height:1.5}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.sync-ok{color:#256d3e}.save-state{font-size:12px;color:#817970;margin-right:auto;align-self:center}.card-actions{display:flex;gap:8px;align-items:center;margin-top:4px}@media(max-width:700px){.top{display:block}.actions{margin-top:12px}.card{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:20px 12px}.cloud{display:block}.cloud-actions{margin-top:10px}.drop{padding:20px 14px}.add-actions{display:grid;grid-template-columns:1fr}.add-actions .btn{width:100%;text-align:center;padding:13px}.photo{min-height:180px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><span class="eyebrow">PHOTO → MEMORY → STORY</span><h1>照片回憶</h1><p class="muted">照片本體目前保存在這台裝置；回憶文字可同步到 Firebase。</p></div>
    <div class="actions"><a class="btn" href="index.html">← 書稿工作室</a><button class="btn" id="export">匯出照片 JSON</button></div>
  </div>

  <div class="cloud">
    <div><strong>☁ 回憶雲端同步</strong><small id="cloudStatus">正在載入 Firebase…</small></div>
    <div class="cloud-actions"><button class="btn primary" id="loginBtn">Google 登入</button><button class="btn" id="syncBtn" hidden>同步全部回憶</button><button class="btn" id="loadBtn" hidden>載入雲端文字</button><button class="btn" id="logoutBtn" hidden>登出</button></div>
  </div>

  <div class="drop">
    <strong>＋ 新增回憶</strong>
    <p class="muted">可以直接拍照、從相簿選照片，或先建立一筆純文字回憶。</p>
    <div class="add-actions">
      <label class="btn primary">📷 拍照<input id="camera" class="hidden" type="file" accept="image/*" capture="environment"></label>
      <label class="btn">🖼 從相簿選擇<input id="files" class="hidden" type="file" accept="image/*" multiple></label>
      <button class="btn" id="textMemory">✎ 純文字回憶</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>
</div>

<script>
(()=>{
const DB='life-archive-v1',STORE='memories',q=s=>document.querySelector(s);let db,items=[];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function blankMemory(extra={}){const now=new Date().toISOString();return{id:uid(),image:'',name:'',title:'',when:'',stage:'其他',place:'',feeling:'',tags:'',chapterIds:'',story:'',created:now,updated:now,...extra}}
function open(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function getAll(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(x);t.oncomplete=()=>{window.dispatchEvent(new CustomEvent('lifearchive:memory-saved',{detail:x}));res()};t.onerror=()=>rej(t.error)})}
function del(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>{window.dispatchEvent(new CustomEvent('lifearchive:memory-deleted',{detail:{id}}));res()};t.onerror=()=>rej(t.error)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stages(v){return['童年','國中','高中','警大','警察工作','研究所','旅行','海外生活','運動／挑戰','其他'].map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}
function photoHtml(x){return x.image?`<img src="${x.image}" alt="${esc(x.title||'回憶照片')}">`:`<div class="photo-empty"><strong>✎</strong>純文字回憶<br><small>之後也可以再補照片</small></div>`}
function render(){
 q('#grid').innerHTML=items.length?items.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(x=>`<article class="card" data-id="${x.id}"><div class="photo">${photoHtml(x)}</div><div class="body"><input class="title" data-f="title" value="${esc(x.title)}" placeholder="替這段回憶取名字"><div class="row"><label>時間<input data-f="when" value="${esc(x.when)}" placeholder="例如：2015 夏天"></label><label>人生階段<select data-f="stage">${stages(x.stage||'其他')}</select></label></div><div class="row"><label>地點<input data-f="place" value="${esc(x.place)}"></label><label>感受<input data-f="feeling" value="${esc(x.feeling||'')}" placeholder="例如：期待、害怕、安心"></label></div><label>標籤<input data-f="tags" value="${esc(x.tags||'')}" placeholder="例如：日本, 旅行, 成長"></label><label>關聯章節<input data-f="chapterIds" value="${esc(x.chapterIds||'')}" placeholder="例如：c12, c19"></label><label>那時候，我在做什麼？<textarea data-f="story">${esc(x.story)}</textarea></label><div class="card-actions"><span class="save-state" data-save>✓ 已自動儲存</span><button class="btn danger" data-del>刪除</button></div></div></article>`).join(''):'<div class="empty">目前還沒有回憶。按上方「＋ 新增回憶」開始第一筆。</div>';
 q('#grid').querySelectorAll('[data-f]').forEach(e=>{e.onchange=e.oninput=()=>{let card=e.closest('.card'),x=items.find(i=>i.id===card.dataset.id);x[e.dataset.f]=e.value;x.updated=new Date().toISOString();const s=card.querySelector('[data-save]');s.textContent='儲存中…';put(x).then(()=>{s.textContent='✓ 已自動儲存'})}});
 q('#grid').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let id=b.closest('.card').dataset.id;if(confirm('刪除這筆回憶？')){await del(id);items=items.filter(x=>x.id!==id);render()}})
}
function dataUrl(f){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.86))};im.onerror=rej;im.src=u})}
async function addFiles(fileList){for(const f of [...fileList]){if(!f.type.startsWith('image/'))continue;let x=blankMemory({image:await dataUrl(f),name:f.name});await put(x);items.push(x)}render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
q('#files').onchange=e=>addFiles(e.target.files);
q('#camera').onchange=e=>addFiles(e.target.files);
q('#textMemory').onclick=async()=>{let x=blankMemory();await put(x);items.push(x);render();requestAnimationFrame(()=>{const card=q(`[data-id="${x.id}"]`);card?.scrollIntoView({behavior:'smooth',block:'center'});card?.querySelector('[data-f="title"]')?.focus()})};
q('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'life-archive',version:3,memories:items},null,2)],{type:'application/json'}));a.download='life-archive-photos-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
window.addEventListener('lifearchive:cloud-import',async e=>{const incoming=e.detail||[];for(const cloud of incoming){let local=items.find(x=>x.id===cloud.id);if(local){Object.assign(local,cloud,{image:local.image,name:local.name});await put(local)}else{let x={...blankMemory(),...cloud,image:'',name:cloud.imageName||''};await put(x);items.push(x)}}render()});
window.lifeArchiveMemories={getItems:()=>items.map(x=>({...x}))};
open().then(async()=>{items=await getAll();render()})
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCaZnmoChuGKYUqRfYKgsV29liGqokiSjA",authDomain:"life-archive-2d4a6.firebaseapp.com",projectId:"life-archive-2d4a6",storageBucket:"life-archive-2d4a6.firebasestorage.app",messagingSenderId:"499371823629",appId:"1:499371823629:web:878bbd928bc86fc0197b44",measurementId:"G-C4NSZW459D"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();const $=id=>document.getElementById(id),status=$('cloudStatus'),login=$('loginBtn'),sync=$('syncBtn'),load=$('loadBtn'),logout=$('logoutBtn');let readyUser=null;
function meta(x){return{id:x.id,title:x.title||'',when:x.when||'',stage:x.stage||'其他',place:x.place||'',feeling:x.feeling||'',tags:String(x.tags||'').split(',').map(s=>s.trim()).filter(Boolean),chapterIds:String(x.chapterIds||'').split(',').map(s=>s.trim()).filter(Boolean),story:x.story||'',imageName:x.name||'',hasLocalImage:!!x.image,created:x.created||'',updated:x.updated||'',updatedAt:serverTimestamp()}}
async function saveCloud(x){if(!readyUser)return;await setDoc(doc(db,'users',readyUser.uid,'memories',x.id),meta(x),{merge:true});status.innerHTML='<span class="sync-ok">✓ 回憶文字已同步</span>'}
window.addEventListener('lifearchive:memory-saved',e=>saveCloud(e.detail).catch(err=>{console.error(err);status.textContent='同步失敗：'+(err.code||err.message)}));
window.addEventListener('lifearchive:memory-deleted',e=>{if(readyUser)deleteDoc(doc(db,'users',readyUser.uid,'memories',e.detail.id)).catch(console.error)});
login.onclick=()=>signInWithPopup(auth,provider).catch(err=>status.textContent='登入失敗：'+(err.code||err.message));logout.onclick=()=>signOut(auth);
sync.onclick=async()=>{if(!readyUser)return;status.textContent='正在同步所有回憶文字…';try{const items=window.lifeArchiveMemories?.getItems?.()||[];for(const x of items)await setDoc(doc(db,'users',readyUser.uid,'memories',x.id),meta(x),{merge:true});status.innerHTML=`<span class="sync-ok">✓ 已同步 ${items.length} 筆回憶文字</span>`}catch(err){status.textContent='同步失敗：'+(err.code||err.message)}};
load.onclick=async()=>{if(!readyUser)return;status.textContent='正在讀取雲端回憶…';try{const snap=await getDocs(collection(db,'users',readyUser.uid,'memories'));const memories=snap.docs.map(d=>{const v=d.data();return{id:d.id,title:v.title||'',when:v.when||'',stage:v.stage||'其他',place:v.place||'',feeling:v.feeling||'',tags:Array.isArray(v.tags)?v.tags.join(', '):'',chapterIds:Array.isArray(v.chapterIds)?v.chapterIds.join(', '):'',story:v.story||'',imageName:v.imageName||'',created:v.created||'',updated:v.updated||''}});if(!memories.length){status.textContent='雲端目前沒有回憶文字';return}if(confirm(`找到 ${memories.length} 筆雲端回憶文字。\n\n相同 ID 會更新本機文字；雲端沒有照片本體，所以不會刪除或取代本機照片。\n\n確定載入？`)){window.dispatchEvent(new CustomEvent('lifearchive:cloud-import',{detail:memories}));status.innerHTML=`<span class="sync-ok">✓ 已載入 ${memories.length} 筆雲端回憶文字</span>`}}catch(err){status.textContent='讀取失敗：'+(err.code||err.message)}};
onAuthStateChanged(auth,user=>{readyUser=user;if(user){login.hidden=true;sync.hidden=false;load.hidden=false;logout.hidden=false;status.innerHTML=`<span class="sync-ok">✓ 已登入 ${user.email||''}</span>`}else{login.hidden=false;sync.hidden=true;load.hidden=true;logout.hidden=true;status.textContent='尚未登入；照片與文字仍會保存在這台裝置'}});
</script>
</body>
</html>
