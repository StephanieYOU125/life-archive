name: Check psychology library

on:
  push:
    branches: [main]
    paths:
      - 'psychology-lenses.js'
      - 'service-worker.js'
      - '.github/workflows/check-psychology-library.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check psychology-lenses.js
      - run: node --check service-worker.js
      - run: grep -q "const CACHE_NAME='life-archive-pwa-v25'" service-worker.js
      - run: grep -q "Narrative Identity" psychology-lenses.js
      - run: grep -q "Implementation Intentions" psychology-lenses.js
      - run: |
          rm -f .github/workflows/check-psychology-library.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time psychology check"
          git push
