name: Run dashboard wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-dashboard-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire dashboard script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dashboard-workspace.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=s.replace("dashboard:'從哪裡開始'", "dashboard:'今日工作台'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check dashboard-workspace.js
          node --check workflow-sidebar.js
          node --check service-worker.js
          grep -q 'dashboard-workspace.js' index.html
          grep -q 'life-archive-pwa-v26' service-worker.js
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/run-dashboard-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire daily dashboard into app"
          git push
