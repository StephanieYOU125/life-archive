<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Life Archive｜Firestore 測試</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f4f0e9;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:24px}
    .wrap{max-width:760px;margin:40px auto}.card{background:#fffdf9;border:1px solid #ded5c9;border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(50,40,30,.08)}
    h1{margin:0 0 8px;font-family:Georgia,"Noto Serif TC",serif}.muted{color:#817970;line-height:1.7}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .btn{border:1px solid #ded5c9;background:#fffdf9;padding:11px 16px;border-radius:11px;cursor:pointer;font:inherit}.primary{background:#7b3945;color:#fff;border-color:#7b3945}
    input,textarea{width:100%;border:1px solid #ded5c9;background:white;border-radius:10px;padding:11px;font:inherit}label{display:grid;gap:6px;margin-top:14px}label span{font-size:12px;color:#817970;font-weight:700}
    .status,.list{margin-top:20px;padding:16px;background:#f7f3ed;border-radius:14px;line-height:1.7}.ok{color:#256d3e;font-weight:700}.error{color:#a32222;font-weight:700}.item{padding:12px 0;border-bottom:1px solid #ded5c9}.item:last-child{border:0}
  </style>
</head>
<body>
  <div class="wrap"><main class="card">
    <small class="muted">LIFE ARCHIVE × FIRESTORE</small>
    <h1>第一筆雲端回憶測試</h1>
    <p class="muted">這一頁只測試「登入 → 寫入 Firestore → 讀回資料」。不會修改你目前 Life Archive 的本機資料。</p>

    <div class="row">
      <button id="loginBtn" class="btn primary">使用 Google 登入</button>
      <button id="logoutBtn" class="btn" hidden>登出</button>
      <a class="btn" href="index.html" style="text-decoration:none;color:inherit">回 Life Archive</a>
    </div>

    <div id="status" class="status">正在載入 Firebase…</div>

    <section id="editor" hidden>
      <label><span>標題</span><input id="title" value="我的第一筆 Firebase 回憶"></label>
      <label><span>內容</span><textarea id="story" rows="5">今天成功把 Life Archive 接上 Firebase。</textarea></label>
      <div class="row"><button id="saveBtn" class="btn primary">儲存到 Firestore</button><button id="loadBtn" class="btn">重新讀取</button></div>
      <div id="list" class="list">尚未讀取資料。</div>
    </section>
  </main></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaZnmoChuGKYUqRfYKgsV29liGqokiSjA",
      authDomain: "life-archive-2d4a6.firebaseapp.com",
      projectId: "life-archive-2d4a6",
      storageBucket: "life-archive-2d4a6.firebasestorage.app",
      messagingSenderId: "499371823629",
      appId: "1:499371823629:web:878bbd928bc86fc0197b44",
      measurementId: "G-C4NSZW459D"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const status = document.getElementById('status');
    const editor = document.getElementById('editor');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const titleEl = document.getElementById('title');
    const storyEl = document.getElementById('story');
    const list = document.getElementById('list');

    loginBtn.onclick = async () => {
      status.textContent = '正在開啟 Google 登入……';
      try { await signInWithPopup(auth, provider); }
      catch (err) { status.innerHTML = `<span class="error">登入失敗</span><br>${err.code || ''}<br>${err.message || err}`; }
    };
    logoutBtn.onclick = () => signOut(auth);

    async function loadMemories(user) {
      list.textContent = '正在讀取 Firestore…';
      try {
        const ref = collection(db, 'users', user.uid, 'memories');
        let snap;
        try { snap = await getDocs(query(ref, orderBy('createdAt', 'desc'))); }
        catch { snap = await getDocs(ref); }
        if (snap.empty) { list.textContent = '目前沒有雲端回憶。'; return; }
        list.innerHTML = '';
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const div = document.createElement('div'); div.className = 'item';
          const t = document.createElement('strong'); t.textContent = data.title || '未命名';
          const p = document.createElement('div'); p.textContent = data.story || '';
          div.append(t,p); list.append(div);
        });
      } catch (err) { list.innerHTML = `<span class="error">讀取失敗</span><br>${err.code || ''}<br>${err.message || err}`; }
    }

    saveBtn.onclick = async () => {
      const user = auth.currentUser;
      if (!user) return;
      saveBtn.disabled = true; status.textContent = '正在寫入 Firestore…';
      try {
        const ref = collection(db, 'users', user.uid, 'memories');
        const docRef = await addDoc(ref, {
          title: titleEl.value.trim(), story: storyEl.value.trim(),
          category: 'test', createdAt: serverTimestamp()
        });
        status.innerHTML = `<span class="ok">✓ 已成功寫入 Firestore</span><br>文件 ID：${docRef.id}`;
        await loadMemories(user);
      } catch (err) { status.innerHTML = `<span class="error">寫入失敗</span><br>${err.code || ''}<br>${err.message || err}`; }
      finally { saveBtn.disabled = false; }
    };
    loadBtn.onclick = () => auth.currentUser && loadMemories(auth.currentUser);

    onAuthStateChanged(auth, user => {
      if (user) {
        loginBtn.hidden = true; logoutBtn.hidden = false; editor.hidden = false;
        status.innerHTML = `<span class="ok">✓ 已登入</span><br>${user.email}<br>UID：${user.uid}`;
        loadMemories(user);
      } else {
        loginBtn.hidden = false; logoutBtn.hidden = true; editor.hidden = true;
        status.textContent = 'Firebase 已載入，請先登入。';
      }
    });
  </script>
</body>
</html>
