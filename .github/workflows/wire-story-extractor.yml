name: Wire Story Extractor
on:
  push:
    paths:
      - '.github/workflows/wire-story-extractor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire story extractor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./story-extractor.js"></script>'
          if tag not in s:
              s=s.replace('<script src="./chapter-editor-plus.js"></script>', '<script src="./chapter-editor-plus.js"></script>\n'+tag)
          p.write_text(s)

          p=Path('service-worker.js')
          s=p.read_text()
          if "'./story-extractor.js'" not in s:
              s=s.replace("'./chapter-editor-plus.js'", "'./chapter-editor-plus.js','./story-extractor.js'",1)
          s=re.sub(r"life-archive-pwa-v\d+","life-archive-pwa-v39",s,count=1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check story-extractor.js
          grep -q 'story-extractor.js' index.html
          grep -q 'story-extractor.js' service-worker.js
          grep -q 'life-archive-pwa-v39' service-worker.js
      - name: Commit and self-delete
        run: |
          rm .github/workflows/wire-story-extractor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/wire-story-extractor.yml
          git commit -m "feat: activate story extractor workspace"
          git push
