<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211f1d"><link rel="manifest" href="manifest.webmanifest"><title>Life Archive｜照片回憶</title><style>body{margin:0;background:#f3eee7;color:#292521;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}*{box-sizing:border-box}.wrap{max-width:980px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end}.top h1{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;margin:7px 0}.muted{color:#817970;line-height:1.7}.btn{display:inline-block;border:1px solid #ded5c9;background:#fffdf9;padding:10px 14px;border-radius:11px;text-decoration:none;color:inherit;cursor:pointer}.primary{background:#7b3945;color:#fff;border-color:#7b3945}.drop{margin:22px 0;background:#fffdf9;border:2px dashed #cbbdaf;border-radius:18px;padding:26px;text-align:center}.hidden{display:none}.grid{display:grid;gap:18px}.card{background:#fffdf9;border:1px solid #ded5c9;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,36%) 1fr}.photo{background:#e7dfd6;min-height:260px;display:grid;place-items:center}.photo img{width:100%;height:100%;max-height:440px;object-fit:contain}.body{padding:18px}.body input,.body textarea,.body select{width:100%;border:1px solid #ded5c9;background:white;border-radius:9px;padding:10px;margin:5px 0 11px}.body textarea{min-height:130px;resize:vertical}.body label{font-size:11px;color:#817970;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.title{font-size:19px;font-weight:750}.empty{text-align:center;color:#817970;padding:45px;background:#fffdf9;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#a34b45}.eyebrow{font-size:11px;color:#7b3945;font-weight:800;letter-spacing:.12em}@media(max-width:700px){.top{display:block}.actions{margin-top:12px}.card{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:20px 12px}}</style></head><body><div class="wrap"><div class="top"><div><span class="eyebrow">PHOTO → MEMORY → STORY</span><h1>照片回憶</h1><p class="muted">從照片找回人生素材。照片與文字只存在目前瀏覽器。</p></div><div class="actions"><a class="btn" href="index.html">← 書稿工作室</a><button class="btn" id="export">匯出照片 JSON</button></div></div><div class="drop"><strong>加入以前的照片</strong><p class="muted">JPG、PNG、WebP；會縮小後存進這個瀏覽器。</p><label class="btn primary">＋ 選擇照片<input id="files" class="hidden" type="file" accept="image/*" multiple></label></div><div id="grid" class="grid"></div></div><script>
(()=>{const DB='life-archive-v1',STORE='memories',q=s=>document.querySelector(s);let db,items=[];const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);function open(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function getAll(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function del(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stages(v){return['童年','國中','高中','警大','警察工作','研究所','旅行','海外生活','運動／挑戰','其他'].map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}function render(){q('#grid').innerHTML=items.length?items.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(x=>`<article class="card" data-id="${x.id}"><div class="photo"><img src="${x.image}" alt=""></div><div class="body"><input class="title" data-f="title" value="${esc(x.title)}" placeholder="替這段回憶取名字"><div class="row"><label>時間<input data-f="when" value="${esc(x.when)}" placeholder="例如：2015 夏天"></label><label>人生階段<select data-f="stage">${stages(x.stage||'其他')}</select></label></div><label>地點<input data-f="place" value="${esc(x.place)}"></label><label>那時候，我在做什麼？<textarea data-f="story">${esc(x.story)}</textarea></label><button class="btn danger" data-del>刪除</button></div></article>`).join(''):'<div class="empty">目前還沒有照片回憶。你也可以先到「舊版資料搬移」匯入原本完整備份。</div>';q('#grid').querySelectorAll('[data-f]').forEach(e=>{e.onchange=e.oninput=()=>{let x=items.find(i=>i.id===e.closest('.card').dataset.id);x[e.dataset.f]=e.value;x.updated=new Date().toISOString();put(x)}});q('#grid').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let id=b.closest('.card').dataset.id;if(confirm('刪除這張回憶？')){await del(id);items=items.filter(x=>x.id!==id);render()}})}function dataUrl(f){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.86))};im.onerror=rej;im.src=u})}q('#files').onchange=async e=>{for(const f of [...e.target.files]){if(!f.type.startsWith('image/'))continue;let x={id:uid(),image:await dataUrl(f),name:f.name,title:'',when:'',stage:'其他',place:'',story:'',created:new Date().toISOString(),updated:new Date().toISOString()};await put(x);items.push(x)}render()};q('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'life-archive',version:1,memories:items},null,2)],{type:'application/json'}));a.download='life-archive-photos-'+new Date().toISOString().slice(0,10)+'.json';a.click()};open().then(async()=>{items=await getAll();render()})})();
</script></body></html>
